<body class="scroll-locked">
  <main id="invitation" class="invitation">
    <section id="hero" class="hero" aria-label="Wedding invitation">
      <img id="heroPoster" class="hero-video" src="./assets/images/mosque-couple-fast-final.webp" alt="A bride in white with a crimson veil and a groom in ivory seated opposite each other, separated by a white floral screen in a mosque courtyard" fetchpriority="high" />
  <div id="opening" class="opening"><div class="opening-art">
    <video id="introVideo" class="opening-video" muted playsinline preload="auto" poster="./assets/images/ribbon-poster-v2.jpg" aria-hidden="true"></video>
    <img fetchpriority="high" id="introPoster" class="opening-poster" src="./assets/images/ribbon-poster-v2.jpg" alt="" />
    <div class="cover-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div><button id="openingGate" class="opening-gate" type="button" aria-label="Open wedding invitation demo"><span class="opening-caption"><img class="opening-monogram" src="./assets/images/gold-az-monogram-custom.png" width="1254" height="1254" alt="" /><small>You’re invited</small><em data-bind="opening.label">Open invitation</em></span></button>
    <button id="skipIntro" class="skip-intro" type="button" hidden>Skip intro</button>
  </div></div>
      <div class="hero-shade" aria-hidden="true" hidden></div>
      <div class="hero-content" hidden><p class="hero-bismillah" lang="ar" dir="rtl" aria-label="بسم الله الرحمن الرحيم" data-bind="hero.bismillah"></p><div class="hero-couple">
        <p class="hero-family" data-bind="hero.families"></p>
        <h1 class="hero-names"><span class="hero-bride" data-bind="hero.bride"></span><span class="hero-amp" data-bind="couple.separator"></span><span class="hero-groom" data-bind="hero.groom"></span></h1>
        <p class="hero-occasions" data-bind="hero.occasions"></p>
      </div></div>
      <a class="scroll-cue" hidden href="#pairs"><span data-bind="hero.scroll"></span><svg width="14" height="9" viewBox="0 0 14 9" aria-hidden="true"><path d="m2 2 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></svg></a>
    </section>
    <div id="heroDivider" class="royal-seam" aria-hidden="true" hidden><img src="./assets/images/royal-seam-divider.png" width="2172" height="724" alt="" decoding="async" /></div>
    <section id="pairs" class="verse-section verse-section--pairs" aria-label="A verse from the Qur’an"><div class="verse-content reveal">
      <p class="verse-arabic" lang="ar" dir="rtl" data-bind="pairsVerse.arabic"></p>
      <p class="verse-translation" data-bind="pairsVerse.translation"></p>
      <p class="verse-reference" data-bind="pairsVerse.reference"></p>
      <div class="ornament" aria-hidden="true"><span>✦</span></div>
    </div></section>
    <div class="royal-seam" aria-hidden="true"><img src="./assets/images/royal-seam-divider.png" width="2172" height="724" alt="" loading="lazy" decoding="async" /></div>
    <section id="formal" class="formal" aria-label="Formal wedding invitation"><canvas id="gardenFireworks" class="fireworks-layer" data-firework-scene="garden" aria-hidden="true"></canvas><div class="formal-content reveal">
      <p class="eyebrow" data-bind="formal.eyebrow"></p><p class="formal-intro" data-bind="formal.invitation"></p>
      <p class="formal-name" data-bind="couple.bride"></p><p class="formal-relation" data-bind="formal.brideRelation"></p><p class="formal-family" data-bind="formal.brideParents"></p>
      <p class="formal-joining" data-bind="formal.joining"></p><p class="formal-name formal-groom" data-bind="couple.groom"></p><p class="formal-relation" data-bind="formal.groomRelation"></p><p class="formal-family" data-bind="formal.groomParents"></p>
      <div class="ornament" aria-hidden="true"><span>✦</span></div>
    </div></section>
    <section id="marriageVerse" class="verse-section verse-section--marriage" aria-label="Compassion and mercy"><div class="verse-content reveal">
      <div class="ornament" aria-hidden="true"><span>✦</span></div>
      <p class="verse-arabic" lang="ar" dir="rtl" data-bind="marriageVerse.arabic"></p>
      <p class="verse-translation" data-bind="marriageVerse.translation"></p>
      <p class="verse-reference" data-bind="marriageVerse.reference"></p>
    </div></section>
    <div class="details-paper">
    <section id="saveDate" class="date-section" aria-labelledby="scratchTitle">
      <div class="scene-ornament" aria-hidden="true"></div>
      <header class="section-heading reveal"><p class="eyebrow" data-bind="scratch.eyebrow"></p><h2 id="scratchTitle" data-bind="scratch.title"></h2></header>
      <p class="scratch-hint reveal" data-bind="scratch.hint"></p><div id="scratchCards" class="scratch-cards reveal"></div><p id="scratchStatus" class="sr-only" role="status"></p>
      <div id="countdown" class="countdown-panel reveal" aria-labelledby="countdownTitle"><div class="ornament" aria-hidden="true"><span>✦</span></div><h3 id="countdownTitle" data-bind="countdown.title"></h3><div id="countdownUnits" class="countdown-units" role="timer" aria-live="off" aria-hidden="true"></div></div>
    </section>
    <div id="events"></div>
    </div>
    <section id="gifts" class="gifts-section" aria-labelledby="giftTitle"><div class="scene-ornament" aria-hidden="true"></div><div class="gift-copy reveal"><p class="eyebrow" data-bind="gifts.eyebrow"></p><h2 id="giftTitle" data-bind="gifts.title"></h2></div><img id="handsImage" class="hands-image" width="1120" height="1400" src="./assets/images/hands.webp" alt="The couple’s joined hands, with white embroidered sleeves and a crimson veil" loading="lazy" decoding="async" /></section>
    <div class="royal-seam" aria-hidden="true"><img src="./assets/images/royal-seam-divider.png" width="2172" height="724" alt="" loading="lazy" decoding="async" /></div>
    <section id="dua" class="dua" aria-labelledby="duaTitle"><div class="dua-content reveal"><h2 id="duaTitle" data-bind="dua.title"></h2><div class="ornament" aria-hidden="true"><span>✦</span></div><p class="dua-prayer" lang="ar" dir="rtl" data-bind="dua.arabic"></p><p id="duaTranslation" class="dua-translation" data-bind="dua.translation"></p><p class="verse-reference" data-bind="dua.reference"></p><p id="duaMessage" class="dua-message" lang="ar" dir="rtl" data-bind="dua.message"></p></div></section>
    <div class="royal-seam" aria-hidden="true"><img src="./assets/images/royal-seam-divider.png" width="2172" height="724" alt="" loading="lazy" decoding="async" /></div>
    <section id="celebration" class="celebration" aria-label="A celebration of Amina and Zayan"><canvas id="fireworksCanvas" data-firework-scene="closing" aria-hidden="true"></canvas><div class="celebration-copy"><p class="eyebrow" data-bind="wellWishes.eyebrow"></p><img id="closingMonogram" class="closing-monogram" width="1254" height="1254" src="./assets/images/gold-az-monogram-custom.png" alt="A and Z gold monogram" loading="lazy" /><p class="celebration-message" data-bind="wellWishes.message"></p><p class="celebration-signoff" data-bind="wellWishes.signoff"></p></div></section>
    <footer class="footer"><p><a href="https://www.instagram.com/noor.invites.nagpur/" target="_blank" rel="noopener noreferrer" data-bind="brand.credit"></a></p></footer>
  </main>
  <canvas id="glimmerCanvas" aria-hidden="true"></canvas>
  <audio id="backgroundMusic" loop preload="metadata"></audio>
  <button id="musicToggle" class="music-toggle" type="button" aria-label="Play music" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z" stroke-linejoin="round"/><g class="sound-waves"><path d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" stroke-linecap="round"/></g><path class="sound-slash" d="m16 9 5 6m0-6-5 6" stroke-linecap="round"/></svg></button>
